[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzlesum"
dynamic = ["version"]
description = "A cross-platform file checksum utility with DOS compatibility and advanced verification features"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Dustin Darcy", email = "6962246+djdarcy@users.noreply.github.com"}
]
keywords = ["checksum", "hash", "verification", "sha256", "cross-platform", "dos-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
# 3.9 floor aligns with the DazzleLib stack (dazzle-lib/filekit/linklib/
# preservelib/tree-lib all require >=3.9) for the src/ refactor
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/DazzleTools/dazzlesum"
"Bug Reports" = "https://github.com/DazzleTools/dazzlesum/issues"
"Source" = "https://github.com/DazzleTools/dazzlesum"
"Documentation" = "https://github.com/DazzleTools/dazzlesum#readme"

[project.scripts]
dazzlesum = "dazzlesum:main"

[project.optional-dependencies]
windows = [
    # Enhanced Windows UNC path support
    # "git+https://github.com/djdarcy/UNCtools.git",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
py-modules = ["dazzlesum"]

[tool.repokit-common]
# Consumed by scripts/repokit-common/sync-versions.py (git-repokit-common subtree)
version-source = "dazzlesum.py"
changelog-file = "CHANGELOG.md"
repo-url = "https://github.com/DazzleTools/dazzlesum"

[tool.setuptools.dynamic]
version = {attr = "dazzlesum.get_package_version"}