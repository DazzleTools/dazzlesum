name: Publish to PyPI

# Publishing a GitHub Release is the trigger for an automatic PyPI upload.
# workflow_dispatch allows a manual CI-side publish; a fully manual local
# path (python -m build; twine upload dist/*) always remains possible.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm manual publish'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.confirm == 'YES'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    # Tests run in CI (python.yml) on every push; the publish job only
    # builds and verifies artifacts, mirroring the dazzlecmd reference.
    - name: Build package
      run: python -m build

    - name: Verify no private/ or local-state content leaked into the artifacts
      run: python scripts/check_dist_no_leak.py dist/

    - name: Check packages
      run: twine check dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish dazzlesum
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dazzlesum

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
